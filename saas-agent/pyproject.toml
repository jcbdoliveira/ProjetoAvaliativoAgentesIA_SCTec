[project]
name = "saas-agent"
version = "1.0.0"
description = "Agente de IA Customer Success B2B — LangChain, LangGraph e FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.45",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "api*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
